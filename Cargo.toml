[package]
name = "any-auto"
version = "0.5.3"
edition = "2024"
description = "Multi-agent approval hooks and persistent reviewers for Antigravity and Pi"
license = "MIT"
repository = "https://github.com/jjyr/any-auto"

[[bin]]
name = "any-auto"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
toml = "0.8"

dialoguer = { version = "0.11", default-features = false, features = ["password"] }
toml_edit = "0.22"
